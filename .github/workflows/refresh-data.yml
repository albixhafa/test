name: Refresh data

on:
  schedule:
    # Weekdays after the US close.
    - cron: "23 22 * * 1-5"
  workflow_dispatch:
  # Rebuild and redeploy whenever the pipeline or the site changes
  # (the bot's own data commit does not retrigger).
  push:
    paths:
      - "pipeline/**"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build dashboard.json from live sources
        run: python -m pipeline.build
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh liquidity data"
            git push origin HEAD:${{ github.ref_name }}
          fi
      # Pages only deploys from the default branch; other branches just refresh the data.
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
